name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r AgenticArxiv/requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest AgenticArxiv/tests/ -v --tb=short

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 AgenticArxiv/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 AgenticArxiv/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
