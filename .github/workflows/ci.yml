name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: 配置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 安装基础与开发依赖
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'

    - name: 在仓库外核对真实编辑式安装
      run: |
        python scripts/check_installation.py --layer base --history artifacts/base_pilot_v1/traces.jsonl

    - name: 核对实际源码边界与依赖元数据
      run: |
        python -m pytest tests/test_architecture.py tests/test_install_metadata.py tests/test_config_resources.py -v --tb=short

    - name: 运行不加载模型或联网的既有回归
      run: |
        python -m pytest tests/ -v --tb=short -m 'not train and not local and not network'

    - name: 构建并核对正常 wheel 安装
      run: |
        python -m build --wheel --outdir "$RUNNER_TEMP/agentic-arxiv-dist"
        python -m venv "$RUNNER_TEMP/agentic-arxiv-wheel"
        "$RUNNER_TEMP/agentic-arxiv-wheel/bin/python" -m pip install "$RUNNER_TEMP"/agentic-arxiv-dist/*.whl
        "$RUNNER_TEMP/agentic-arxiv-wheel/bin/python" scripts/check_installation.py --layer base --require-wheel --history artifacts/base_pilot_v1/traces.jsonl

    - name: 检查源码语法与未定义名称
      run: |
        python -m flake8 src/agentic_arxiv scripts/maintenance scripts/check_installation.py --count --select=E9,F63,F7,F82 --show-source --statistics

  local:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: 安装不含训练器的本地推理依赖
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[local,dev]'
    - name: 核对本地依赖隔离与既有 client 回归
      run: |
        python scripts/check_installation.py --layer local --history artifacts/base_pilot_v1/traces.jsonl
        python -m pytest tests/test_llm_request_params.py tests/test_llm_client_retry.py tests/test_api_rollout_model.py tests/test_figure_analysis_tool.py tests/test_paper_summary_tool.py -v --tb=short -m 'not network'

  train:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: 在 Linux 安装声明的训练依赖
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[train,logging,dev]'
    - name: 在不加载模型的条件下核对训练安装层
      run: |
        python scripts/check_installation.py --layer train --history artifacts/base_pilot_v1/traces.jsonl
    - name: 运行既有无模型训练与共享回归
      run: |
        python -m pytest tests/ -v --tb=short -m 'not network'
